name: Fix CRON_SECRET via Vercel API

on:
  workflow_dispatch:

jobs:
  fix-cron-secret:
    runs-on: ubuntu-latest
    steps:
      - name: Generate clean CRON_SECRET
        id: generate
        run: |
          # Generate clean 32-byte hex string (64 chars)
          CLEAN_SECRET=$(openssl rand -hex 32)
          echo "secret=$CLEAN_SECRET" >> $GITHUB_OUTPUT
          echo "Generated clean CRON_SECRET (64 chars, no whitespace)"

      - name: Delete existing CRON_SECRET via API
        env:
          VERCEL_TOKEN: ${{ secrets.Vercel }}
          PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          echo "Checking for existing CRON_SECRET..."
          
          # List all env vars to find CRON_SECRET ID
          ENV_LIST=$(curl -s -X GET \
            "https://api.vercel.com/v10/projects/$PROJECT_ID/env?decrypt=false" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json")
          
          # Extract CRON_SECRET env ID if it exists
          ENV_ID=$(echo "$ENV_LIST" | jq -r '.envs[] | select(.key == "CRON_SECRET") | .id')
          
          if [ -n "$ENV_ID" ] && [ "$ENV_ID" != "null" ]; then
            echo "Found existing CRON_SECRET with ID: $ENV_ID"
            echo "Deleting..."
            
            # Delete the env var
            curl -s -X DELETE \
              "https://api.vercel.com/v10/projects/$PROJECT_ID/env/$ENV_ID" \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              -H "Content-Type: application/json"
            
            echo "Deleted existing CRON_SECRET"
            sleep 2
          else
            echo "No existing CRON_SECRET found"
          fi

      - name: Create new clean CRON_SECRET via API
        env:
          VERCEL_TOKEN: ${{ secrets.Vercel }}
          PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          SECRET="${{ steps.generate.outputs.secret }}"
          
          echo "Creating new CRON_SECRET..."
          
          # Create the env var via API
          RESPONSE=$(curl -s -X POST \
            "https://api.vercel.com/v10/projects/$PROJECT_ID/env" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{
              \"key\": \"CRON_SECRET\",
              \"value\": \"$SECRET\",
              \"target\": [\"production\", \"preview\", \"development\"],
              \"type\": \"encrypted\"
            }")
          
          echo "API Response:"
          echo "$RESPONSE" | jq '.'
          
          # Check if successful
          if echo "$RESPONSE" | jq -e '.error' > /dev/null 2>&1; then
            echo "Error creating CRON_SECRET"
            exit 1
          fi
          
          echo "✅ CRON_SECRET created successfully"

      - name: Trigger redeployment
        env:
          VERCEL_TOKEN: ${{ secrets.Vercel }}
          PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          echo "Triggering redeployment..."
          
          # Create a deployment via API
          DEPLOY_RESPONSE=$(curl -s -X POST \
            "https://api.vercel.com/v13/deployments" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{
              \"name\": \"v0-dispatchly\",
              \"project\": \"$PROJECT_ID\",
              \"target\": \"production\"
            }")
          
          echo "Deploy Response:"
          echo "$DEPLOY_RESPONSE" | jq '.'
          
          echo "✅ Redeployment triggered"

      - name: Summary
        run: |
          echo "========================================"
          echo "✅ CRON_SECRET Fixed!"
          echo "========================================"
          echo "A new clean CRON_SECRET has been set via Vercel API"
          echo "Redeployment is in progress..."
          echo ""
          echo "Check deployment status at:"
          echo "https://vercel.com/dashboard"
