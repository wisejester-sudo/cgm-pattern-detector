name: Set Vercel CRON_SECRET

on:
  # Manual trigger
  workflow_dispatch:
    inputs:
      cron_secret:
        description: 'CRON_SECRET value (leave empty to auto-generate)'
        required: false
        type: string

  # Auto-run on first deployment
  push:
    branches:
      - main
    paths:
      - 'vercel.json'

jobs:
  set-cron-secret:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Generate or use provided CRON_SECRET
        id: secret
        run: |
          if [ -n "${{ github.event.inputs.cron_secret }}" ]; then
            # Trim whitespace from input
            TRIMMED_SECRET=$(echo "${{ github.event.inputs.cron_secret }}" | tr -d ' \n\r\t')
            echo "CRON_SECRET=$TRIMMED_SECRET" >> $GITHUB_OUTPUT
          else
            # Generate random 32-byte hex string
            GENERATED_SECRET=$(openssl rand -hex 32)
            echo "CRON_SECRET=$GENERATED_SECRET" >> $GITHUB_OUTPUT
            echo "Generated new CRON_SECRET"
          fi

      - name: Set CRON_SECRET in Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.Vercel }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          echo "Setting CRON_SECRET in Vercel..."
          # Remove existing CRON_SECRET if it exists (ignore errors)
          vercel env rm CRON_SECRET production --token="$VERCEL_TOKEN" --yes 2>/dev/null || true
          # Add new CRON_SECRET
          vercel env add CRON_SECRET production --token="$VERCEL_TOKEN" --yes <<< "${{ steps.secret.outputs.CRON_SECRET }}"

      - name: Trigger redeployment
        env:
          VERCEL_TOKEN: ${{ secrets.Vercel }}
        run: |
          echo "Triggering redeployment to apply new environment variable..."
          vercel --prod --token="$VERCEL_TOKEN" --yes

      - name: Output secret (masked)
        run: |
          echo "✅ CRON_SECRET has been set in Vercel"
          echo "The secret value has been securely stored"
